<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Class</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text: #e5e5e5;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
            margin-top: 1.5rem;
        }

        .asset-node {
            background: var(--card);
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .asset-node img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            background: #222;
        }

        .asset-node span {
            font-size: 0.95rem;
            font-weight: 500;
            word-break: break-word;
        }

        .asset-node:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
    </style>
</head>

<body>
    <h1>Math Class</h1>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSewSgNGDuouAaEFoEh8swzHfS4rlzzZB_cX18ba3RisgVHinw/viewform?embedded=true" width="640" height="422" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    
    <div class="data-grid" id="node-container">Loading catalog stream...</div>

    <script>
        const _USER = 'termsofse';
        const _REPO = 'math-class';

        let gameMap = {};
        const gameCache = {}; // In-memory cache for loaded game assets

        async function _initMenu() {
            const container = document.getElementById('node-container');
            container.innerHTML = '';

            try {
                const res = await fetch(`https://raw.githubusercontent.com/${_USER}/${_REPO}/main/names.json?t=${Date.now()}`);
                if (!res.ok) throw new Error('Network fetch failed');

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    const regex = /"([^"]+)"\s*:\s*"([^"]+)"/g;
                    let match;

                    while ((match = regex.exec(buffer)) !== null) {
                        const displayName = match[1];
                        const fileName = match[2];

                        if (!gameMap[displayName]) {
                            gameMap[displayName] = fileName;
                            _appendNode(displayName, fileName);
                        }
                    }
                }

                if (Object.keys(gameMap).length === 0) {
                    container.innerText = 'No items found in catalog.';
                }
            } catch (err) {
                container.innerText = 'Failed to load game index.';
            }
        }

        function _appendNode(displayName, fileName) {
            const g = document.getElementById('node-container');
            const c = document.createElement('div');
            c.className = 'asset-node';
            c.onclick = () => _loadGame(fileName, displayName);

            const img = document.createElement('img');
            img.src = `https://raw.githubusercontent.com/${_USER}/${_REPO}/main/thumbnails/${fileName}.png`;
            img.alt = displayName;
            img.loading = 'lazy';
            img.onerror = () => {
                img.style.display = 'none';
            };

            const title = document.createElement('span');
            title.innerText = displayName;

            c.appendChild(img);
            c.appendChild(title);
            g.appendChild(c);
        }

        async function _loadGame(fileName, displayName) {
            let win = window.open('about:blank', '_blank');
            if (!win) {
                alert('Popup blocked! Please allow popups for this site.');
                return;
            }

            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body {
                            background: #0a0a0c;
                            color: #e5e5e5;
                            font-family: 'Segoe UI', system-ui, sans-serif;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                            margin: 0;
                            overflow: hidden;
                        }
                        .loader-box {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            background: #141416;
                            border: 1px solid #2a2a2e;
                            padding: 2.5rem 3rem;
                            border-radius: 20px;
                            box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 20px rgba(59, 130, 246, 0.4);
                            max-width: 400px;
                            width: 90%;
                            text-align: center;
                        }
                        .spinner-ring {
                            position: relative;
                            width: 70px;
                            height: 70px;
                            margin-bottom: 1.5rem;
                        }
                        .spinner-ring div {
                            box-sizing: border-box;
                            position: absolute;
                            width: 70px;
                            height: 70px;
                            border: 4px solid transparent;
                            border-top-color: #3b82f6;
                            border-radius: 50%;
                            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
                        }
                        .spinner-ring div:nth-child(2) {
                            width: 50px;
                            height: 50px;
                            top: 10px;
                            left: 10px;
                            border-top-color: #60a5fa;
                            animation: spin 0.8s linear infinite reverse;
                        }
                        #loader-title {
                            font-size: 1.25rem;
                            font-weight: 600;
                            color: #fff;
                            margin-bottom: 0.4rem;
                        }
                        #loader-subtext {
                            font-size: 0.9rem;
                            color: #888;
                            font-family: monospace;
                        }
                        @keyframes spin {
                            0% { transform: rotate(0deg); }
                            100% { transform: rotate(360deg); }
                        }
                    </style>
                </head>
                <body>
                    <div class="loader-box">
                        <div class="spinner-ring">
                            <div></div>
                            <div></div>
                        </div>
                        <div id="loader-title">Loading ${displayName}</div>
                        <div id="loader-subtext">Initializing asset stream...</div>
                    </div>
                </body>
                </html>
            `);

            try {
                let decodedHtml;

                if (gameCache[fileName]) {
                    // Fast path: pull straight from memory cache
                    win.document.getElementById('loader-title').innerText = 'Loading from Cache';
                    win.document.getElementById('loader-subtext').innerText = 'Instant memory retrieval...';
                    await new Promise(r => setTimeout(r, 120)); // Brief flash of the loader
                    decodedHtml = gameCache[fileName];
                } else {
                    // Slow path: fetch from GitHub and decode
                    const res = await fetch(`https://raw.githubusercontent.com/${_USER}/${_REPO}/main/games/${fileName}.txt?t=${Date.now()}`);
                    if (!res.ok) throw new Error('Network fetch failed');
                    
                    win.document.getElementById('loader-title').innerText = 'Decrypting Payload';
                    win.document.getElementById('loader-subtext').innerText = 'Processing Base64 string data...';
                    
                    const base64Data = await res.text();
                    await new Promise(r => setTimeout(r, 60));

                    win.document.getElementById('loader-title').innerText = 'Building Sandbox';
                    win.document.getElementById('loader-subtext').innerText = 'Deobfuscating client runtime...';

                    decodedHtml = decodeURIComponent(escape(atob(base64Data.trim())));
                    
                    // Save into cache for next time
                    gameCache[fileName] = decodedHtml;
                    
                    await new Promise(r => setTimeout(r, 40));
                }

                win.document.getElementById('loader-title').innerText = 'Launching';
                win.document.getElementById('loader-subtext').innerText = 'Injecting into secure window...';

                await new Promise(r => setTimeout(r, 150));

                win.document.open();
                win.document.write(decodedHtml);
                win.document.close();

            } catch (err) {
                win.close();
                alert('Error launching game asset. Please check network connection.');
            }
        }

        _initMenu();
    </script>
</body>

</html>
