<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Class</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text: #e5e5e5;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
            margin-top: 1.5rem;
        }

        .asset-node {
            background: var(--card);
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .asset-node:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
    </style>
</head>

<body>
    <h1>Math Class</h1>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSewSgNGDuouAaEFoEh8swzHfS4rlzzZB_cX18ba3RisgVHinw/viewform?embedded=true" width="640" height="422" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    
    <div class="data-grid" id="node-container">Loading catalog...</div>

    <script>
        const _USER = 'termsofse';
        const _REPO = 'math-class';

        let gameMap = {};

        async function _initMenu() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${_USER}/${_REPO}/main/names.json`);
                gameMap = await res.json();
                _refresh(gameMap);
            } catch (err) {
                document.getElementById('node-container').innerText = 'Failed to load game index.';
            }
        }

        function _refresh(map) {
            const g = document.getElementById('node-container');
            g.innerHTML = '';
            
            for (const [displayName, fileName] of Object.entries(map)) {
                const c = document.createElement('div');
                c.className = 'asset-node';
                c.innerText = displayName;
                c.onclick = () => _loadGame(fileName, displayName);
                g.appendChild(c);
            }
        }

        async function _loadGame(fileName, displayName) {
            // 1. Instantly open the blank window synchronously to bypass popup blockers and shift focus
            let win = window.open('about:blank', '_blank');
            if (!win) {
                alert('Popup blocked! Please allow popups for this site.');
                return;
            }

            // 2. Immediately paint the gorgeous cyberpunk loading screen directly inside the new tab
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body {
                            background: #0a0a0c;
                            color: #e5e5e5;
                            font-family: 'Segoe UI', system-ui, sans-serif;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                            margin: 0;
                            overflow: hidden;
                        }
                        .loader-box {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            background: #141416;
                            border: 1px solid #2a2a2e;
                            padding: 2.5rem 3rem;
                            border-radius: 20px;
                            box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 20px rgba(59, 130, 246, 0.4);
                            max-width: 400px;
                            width: 90%;
                            text-align: center;
                        }
                        .spinner-ring {
                            position: relative;
                            width: 70px;
                            height: 70px;
                            margin-bottom: 1.5rem;
                        }
                        .spinner-ring div {
                            box-sizing: border-box;
                            position: absolute;
                            width: 70px;
                            height: 70px;
                            border: 4px solid transparent;
                            border-top-color: #3b82f6;
                            border-radius: 50%;
                            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
                        }
                        .spinner-ring div:nth-child(2) {
                            width: 50px;
                            height: 50px;
                            top: 10px;
                            left: 10px;
                            border-top-color: #60a5fa;
                            animation: spin 0.8s linear infinite reverse;
                        }
                        #loader-title {
                            font-size: 1.25rem;
                            font-weight: 600;
                            color: #fff;
                            margin-bottom: 0.4rem;
                        }
                        #loader-subtext {
                            font-size: 0.9rem;
                            color: #888;
                            font-family: monospace;
                        }
                        @keyframes spin {
                            0% { transform: rotate(0deg); }
                            100% { transform: rotate(360deg); }
                        }
                    </style>
                </head>
                <body>
                    <div class="loader-box">
                        <div class="spinner-ring">
                            <div></div>
                            <div></div>
                        </div>
                        <div id="loader-title">Loading ${displayName}</div>
                        <div id="loader-subtext">Connecting to secure stream...</div>
                    </div>
                </body>
                </html>
            `);

            try {
                // 3. Fetch the massive Base64 text file from GitHub in the background
                const res = await fetch(`https://raw.githubusercontent.com/${_USER}/${_REPO}/main/games/${fileName}.txt?t=${Date.now()}`);
                if (!res.ok) throw new Error('Network fetch failed');
                
                win.document.getElementById('loader-title').innerText = 'Decrypting Payload';
                win.document.getElementById('loader-subtext').innerText = 'Processing Base64 string data...';
                
                const base64Data = await res.text();
                
                await new Promise(r => setTimeout(r, 60));

                win.document.getElementById('loader-title').innerText = 'Building Sandbox';
                win.document.getElementById('loader-subtext').innerText = 'Deobfuscating client runtime...';

                const decodedHtml = decodeURIComponent(escape(atob(base64Data.trim())));
                
                await new Promise(r => setTimeout(r, 40));

                win.document.getElementById('loader-title').innerText = 'Launching';
                win.document.getElementById('loader-subtext').innerText = 'Injecting into secure window...';

                // Give a split second to see the final status text before clearing
                await new Promise(r => setTimeout(r, 200));

                // 4. Overwrite the loading screen window with the real game code
                win.document.open();
                win.document.write(decodedHtml);
                win.document.close();

            } catch (err) {
                win.close();
                alert('Error launching game asset. Please check network connection.');
            }
        }

        _initMenu();
    </script>
</body>

</html>
