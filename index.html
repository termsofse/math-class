<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Class</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text: #e5e5e5;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .search-container {
            width: 100%;
            max-width: 900px;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .search-bar {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--card);
            border: 1px solid #2a2a2e;
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
            margin-top: 1rem;
        }

        .asset-node {
            background: var(--card);
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .asset-node img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            background: #222;
        }

        .asset-node span {
            font-size: 0.95rem;
            font-weight: 500;
            word-break: break-word;
        }

        .asset-node:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .error-box {
            color: #ef4444;
            font-family: monospace;
            background: #1f1212;
            border: 1px solid #7f1d1d;
            padding: 1rem;
            border-radius: 8px;
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-top: 1.5rem;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <h1>Math Class</h1>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSewSgNGDuouAaEFoEh8swzHfS4rlzzZB_cX18ba3RisgVHinw/viewform?embedded=true" width="640" height="422" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>

    <div class="search-container">
        <input type="text" id="search-input" class="search-bar" placeholder="Search games starting with..." oninput="_filterCatalog()" />
    </div>

    <div class="data-grid" id="node-container">Loading catalog stream...</div>

    <script>
        const _USER = 'termsofse';
        const _REPO = 'math-class';

        const _DB_NAME = 'math-class-cache';
        const _DB_VERSION = 1;
        const _STORE = 'games';

        let gameMap = {};
        const gameCache = {}; // L1: in-memory fast path (survives within this page session)

        // ---------- IndexedDB layer ----------
        let _dbPromise = null;

        function _openDB() {
            if (!_dbPromise) {
                _dbPromise = new Promise((resolve, reject) => {
                    const req = indexedDB.open(_DB_NAME, _DB_VERSION);
                    req.onupgradeneeded = () => {
                        const db = req.result;
                        if (!db.objectStoreNames.contains(_STORE)) {
                            db.createObjectStore(_STORE); // keyPath: none, we use fileName as the key
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                }).catch(err => {
                    _dbPromise = null; // allow retry on next use
                    throw err;
                });
            }
            return _dbPromise;
        }

        function _dbGet(fileName) {
            return _openDB().then(db => new Promise((resolve, reject) => {
                const tx = db.transaction(_STORE, 'readonly');
                const req = tx.objectStore(_STORE).get(fileName);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            }));
        }

        function _dbSet(fileName, html) {
            return _openDB().then(db => new Promise((resolve, reject) => {
                const tx = db.transaction(_STORE, 'readwrite');
                tx.objectStore(_STORE).put({ html: html, savedAt: Date.now() }, fileName);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            }));
        }

        function _dbDelete(fileName) {
            return _openDB().then(db => new Promise((resolve, reject) => {
                const tx = db.transaction(_STORE, 'readwrite');
                tx.objectStore(_STORE).delete(fileName);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            }));
        }

        function _dbClear() {
            return _openDB().then(db => new Promise((resolve, reject) => {
                const tx = db.transaction(_STORE, 'readwrite');
                tx.objectStore(_STORE).clear();
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            }));
        }

        function _setLoader(win, title, subtext) {
            const t = win.document.getElementById('loader-title');
            const s = win.document.getElementById('loader-subtext');
            if (t) t.innerText = title;
            if (s) s.innerText = subtext;
        }

        const _delay = ms => new Promise(r => setTimeout(r, ms));

        // ---------- Menu ----------
        async function _initMenu() {
            const container = document.getElementById('node-container');
            container.innerHTML = '';

            try {
                const res = await fetch(`https://math-class-inky.vercel.app/names.json?t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP Error ${res.status}: ${res.statusText}`);

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    const regex = /"([^"]+)"\s*:\s*"([^"]+)"/g;
                    let match;

                    while ((match = regex.exec(buffer)) !== null) {
                        const displayName = match[1];
                        const fileName = match[2];

                        if (!gameMap[displayName]) {
                            gameMap[displayName] = fileName;
                            _appendNode(displayName, fileName);
                        }
                    }
                }

                if (Object.keys(gameMap).length === 0) {
                    container.innerHTML = '<div class="error-box">No items found in catalog index.</div>';
                }
            } catch (err) {
                container.innerHTML = `<div class="error-box">Failed to load game index: ${err.message}</div>`;
            }
        }

        function _appendNode(displayName, fileName) {
            const g = document.getElementById('node-container');
            const c = document.createElement('div');
            c.className = 'asset-node';
            c.dataset.name = displayName.toLowerCase(); // Store lowercase name for searching
            c.onclick = () => _loadGame(fileName, displayName);

            const img = document.createElement('img');
            img.src = `https://math-class-inky.vercel.app/thumbnails/${fileName}.png`;
            img.alt = displayName;
            img.loading = 'lazy';
            img.onerror = () => {
                img.style.display = 'none';
            };

            const title = document.createElement('span');
            title.innerText = displayName;

            c.appendChild(img);
            c.appendChild(title);
            g.appendChild(c);
        }

        function _filterCatalog() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const nodes = document.getElementsByClassName('asset-node');

            for (let node of nodes) {
                const name = node.dataset.name;
                // Checks if the game title starts with the search query
                if (name.startsWith(query)) {
                    node.style.display = 'flex';
                } else {
                    node.style.display = 'none';
                }
            }
        }

        // ---------- Game loading ----------
        async function _loadGame(fileName, displayName) {
            let win = window.open('about:blank', '_blank');
            if (!win) {
                alert('Popup blocked! Please allow popups for this site.');
                return;
            }

            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body {
                            background: #0a0a0c;
                            color: #e5e5e5;
                            font-family: 'Segoe UI', system-ui, sans-serif;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                            margin: 0;
                            overflow: hidden;
                        }
                        .loader-box {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            background: #141416;
                            border: 1px solid #2a2a2e;
                            padding: 2.5rem 3rem;
                            border-radius: 20px;
                            box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 20px rgba(59, 130, 246, 0.4);
                            max-width: 400px;
                            width: 90%;
                            text-align: center;
                        }
                        .spinner-ring {
                            position: relative;
                            width: 70px;
                            height: 70px;
                            margin-bottom: 1.5rem;
                        }
                        .spinner-ring div {
                            box-sizing: border-box;
                            position: absolute;
                            width: 70px;
                            height: 70px;
                            border: 4px solid transparent;
                            border-top-color: #3b82f6;
                            border-radius: 50%;
                            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
                        }
                        .spinner-ring div:nth-child(2) {
                            width: 50px;
                            height: 50px;
                            top: 10px;
                            left: 10px;
                            border-top-color: #60a5fa;
                            animation: spin 0.8s linear infinite reverse;
                        }
                        #loader-title {
                            font-size: 1.25rem;
                            font-weight: 600;
                            color: #fff;
                            margin-bottom: 0.4rem;
                        }
                        #loader-subtext {
                            font-size: 0.9rem;
                            color: #888;
                            font-family: monospace;
                        }
                        @keyframes spin {
                            0% { transform: rotate(0deg); }
                            100% { transform: rotate(360deg); }
                        }
                    </style>
                </head>
                <body>
                    <div class="loader-box">
                        <div class="spinner-ring">
                            <div></div>
                            <div></div>
                        </div>
                        <div id="loader-title">Loading ${displayName}</div>
                        <div id="loader-subtext">Initializing asset stream...</div>
                    </div>
                </body>
                </html>
            `);

            try {
                let decodedHtml;

                // L1: in-memory cache (same page session)
                if (gameCache[fileName]) {
                    _setLoader(win, 'Loading from Cache', 'Instant memory retrieval...');
                    await _delay(120);
                    decodedHtml = gameCache[fileName];
                } else {
                    // L2: IndexedDB (persists across sessions/reloads)
                    let cached = null;
                    try {
                        cached = await _dbGet(fileName);
                    } catch (e) {
                        // IndexedDB unavailable (private mode, blocked, etc.) — fall through to fetch
                    }

                    if (cached && cached.html) {
                        _setLoader(win, 'Loading from Cache', 'Retrieving from IndexedDB...');
                        await _delay(120);
                        decodedHtml = cached.html;
                        gameCache[fileName] = decodedHtml; // promote to L1
                    } else {
                        const res = await fetch(`https://math-class-inky.vercel.app/games/${fileName}.txt?t=${Date.now()}`);
                        if (!res.ok) throw new Error(`HTTP Error ${res.status}: ${res.statusText}`);

                        _setLoader(win, 'Decrypting Payload', 'Processing Base64 string data...');

                        const base64Data = await res.text();
                        await _delay(60);

                        _setLoader(win, 'Building Sandbox', 'Deobfuscating client runtime...');

                        decodedHtml = decodeURIComponent(escape(atob(base64Data.trim())));
                        gameCache[fileName] = decodedHtml;

                        // Persist to IndexedDB (non-fatal if it fails)
                        try {
                            await _dbSet(fileName, decodedHtml);
                        } catch (e) {
                            console.warn('IndexedDB cache write failed:', e);
                        }

                        await _delay(40);
                    }
                }

                _setLoader(win, 'Launching', 'Injecting into secure window...');
                await _delay(150);

                win.document.open();
                win.document.write(decodedHtml);
                win.document.close();

            } catch (err) {
                win.document.open();
                win.document.write(`
                    <html>
                    <body style="background:#0a0a0c; color:#ef4444; font-family:monospace; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; text-align:center; padding:2rem;">
                        <div>
                            <h2>Error launching game asset:</h2>
                            <p style="color:#e5e5e5; background:#1f1212; border:1px solid #7f1d1d; padding:1rem; border-radius:8px;">${err.message}</p>
                        </div>
                    </body>
                    </html>
                `);
                win.document.close();
            }
        }

        _initMenu();
    </script>
</body>

</html>
