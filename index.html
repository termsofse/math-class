<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Dashboard</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --accent: #3b82f6;
            --text: #e5e5e5;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
            margin-top: 1.5rem;
        }

        .asset-node {
            background: var(--card);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .asset-node:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        /* Full-Screen Loading Overlay Styles */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 15, 15, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        #loader-text {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Full-Screen Loading Overlay -->
    <div id="loader-overlay">
        <div class="spinner"></div>
        <div id="loader-text">Preparing assets...</div>
    </div>

    <h1>Math Class</h1>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSewSgNGDuouAaEFoEh8swzHfS4rlzzZB_cX18ba3RisgVHinw/viewform?embedded=true" width="640" height="422" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    
    <div class="data-grid" id="node-container">Loading games...</div>

    <script>
        const _USER = 'termsofse';
        const _REPO = 'math-class';
        const VERCEL_BASE = 'https://your-vercel-app.vercel.app';

        let gameMap = {};

        async function _initMenu() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${_USER}/${_REPO}/main/names.json`);
                gameMap = await res.json();
                _refresh(gameMap);
            } catch (err) {
                document.getElementById('node-container').innerText = 'Failed to load game index.';
            }
        }

        function _refresh(map) {
            const g = document.getElementById('node-container');
            g.innerHTML = '';
            
            for (const [displayName, fileName] of Object.entries(map)) {
                const c = document.createElement('div');
                c.className = 'asset-node';
                c.innerText = displayName;
                c.onclick = () => _loadGame(fileName, displayName);
                g.appendChild(c);
            }
        }

        async function _loadGame(fileName, displayName) {
            const overlay = document.getElementById('loader-overlay');
            const loaderText = document.getElementById('loader-text');
            
            // 1. Instantly spawn the window synchronously to bypass popup blockers
            let win = window.open('about:blank', '_blank');
            if (!win) {
                alert('Popup blocked! Please allow popups for this site.');
                return;
            }

            // 2. Turn the current menu page into a slick loading screen
            loaderText.innerText = `Loading ${displayName}...`;
            overlay.style.display = 'flex';

            try {
                // 3. Fetch the massive Base64 text file from GitHub
                const res = await fetch(`https://raw.githubusercontent.com/${_USER}/${_REPO}/main/games/${fileName}.txt`);
                if (!res.ok) throw new Error('Fetch failed');
                
                const base64Data = await res.text();
                
                // Let the UI breathe so the overlay renders smoothly before atob() locks the thread
                await new Promise(r => setTimeout(r, 50));
                loaderText.innerText = `Decrypting and launching...`;

                // Decode base64 payload
                const decodedHtml = decodeURIComponent(escape(atob(base64Data.trim())));

                // 4. Inject the code into our pre-opened window
                win.document.open();
                win.document.write(decodedHtml);
                win.document.close();

            } catch (err) {
                win.close(); // Close the blank window if something failed
                alert('Error launching game asset.');
            } finally {
                // Hide the loading overlay on the menu page
                overlay.style.display = 'none';
            }
        }

        _initMenu();
    </script>
</body>

</html>
